<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0120"/>
      <stop offset="100%" stop-color="#060018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- subtle grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <defs>
      <pattern id="p" width="80" height="80" patternUnits="userSpaceOnUse">
        <path d="M80 0 L0 0 0 80" fill="none" stroke="#ffffff" stroke-width="0.6"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#p)" />
  </g>

  <!-- circuit traces -->
  <g stroke="url(#accent)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M150 220 H400 V320 H520" stroke-opacity="0.9" />
    <circle cx="150" cy="220" r="4" fill="#fff" opacity="0.9" />
    <circle cx="520" cy="320" r="5" fill="#fff" opacity="0.9" />

    <path d="M300 760 H520 V640 H760" stroke-opacity="0.85" />
    <circle cx="300" cy="760" r="4" fill="#fff" opacity="0.85" />
    <circle cx="760" cy="640" r="5" fill="#fff" opacity="0.85" />

    <path d="M1400 180 H1600 V300 H1700" stroke-opacity="0.9" />
    <circle cx="1400" cy="180" r="4" fill="#fff" opacity="0.9" />
    <circle cx="1700" cy="300" r="5" fill="#fff" opacity="0.9" />

    <path d="M1200 800 H1500 V880 H1680" stroke-opacity="0.8" />
    <circle cx="1200" cy="800" r="4" fill="#fff" opacity="0.8" />
    <circle cx="1680" cy="880" r="5" fill="#fff" opacity="0.8" />

    <!-- diagonal traces -->
    <path d="M900 100 L1100 260 L1280 200 L1400 320" stroke-opacity="0.75" />
    <path d="M200 900 L420 740 L640 820" stroke-opacity="0.7" />
    <!-- additional dense traces -->
    <path d="M100 400 H320 V360 H480 V420 H680" stroke-opacity="0.6" />
    <path d="M480 420 L760 300 L920 360 L1100 300" stroke-opacity="0.5" />
    <path d="M980 520 H1180 V560 H1300 V520 H1500" stroke-opacity="0.55" />
    <path d="M300 120 L520 220 L680 160 L820 240 L980 180" stroke-opacity="0.45" />
    <path d="M140 680 H260 V640 H380 V700 H520" stroke-opacity="0.5" />
    <path d="M1600 720 L1420 660 L1280 700 L1100 660" stroke-opacity="0.5" />
  </g>

  <!-- soft glow accents -->
  <g filter="url(#soft)" opacity="0.25">
    <ellipse cx="350" cy="240" rx="240" ry="120" fill="#7c3aed"/>
    <ellipse cx="1450" cy="300" rx="200" ry="100" fill="#6b21a8"/>
  </g>

  <!-- small node dots -->
  <g fill="#b794f4" opacity="0.9">
    <circle cx="430" cy="300" r="2.5" />
    <circle cx="600" cy="260" r="2.5" />
    <circle cx="1100" cy="220" r="2.5" />
    <circle cx="1380" cy="320" r="2.5" />
    <circle cx="480" cy="760" r="2.5" />
    <circle cx="1250" cy="820" r="2.5" />
  </g>

</svg>
